# Ambiente do pokemon-showdown-custom.
#
# Serviços:
#   login        login server próprio (gera chaves RSA e token interno no 1º start)
#   client-build compila o cliente com os dados do NOSSO servidor (roda e termina)
#   server       servidor de jogo do PS
#   web          Caddy: HTTPS, cliente estático e proxy para login/servidor
#
# Uso: docker compose up -d   →   https://ps.localhost
# Ver docs/ambiente-local.md

name: pokemon-showdown-custom

x-node: &node
  image: node:24-bookworm-slim
  init: true
  restart: unless-stopped

# Logs dos containers com tamanho máximo (LGPD: retenção limitada; os logs podem ter
# nomes de usuário). Até 3 arquivos de 10 MB por serviço.
x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: "3"

services:
  login:
    logging: *logging
    <<: *node
    working_dir: /app
    command: ["node", "src/server.ts"]
    environment:
      PS_HOST: ${PS_HOST:-ps.localhost}
      LOGIN_KEY_ID: ${LOGIN_KEY_ID:-1}
      LOGIN_PRIVATE_KEY_DIR: /data/keys
      LOGIN_DATABASE: /data/login.db
      LOGIN_SHARED_DIR: /shared
      # Nomes de admin só podem ser cadastrados com convite reservado para eles
      PS_ADMINS: ${PS_ADMINS:-}
    volumes:
      - ./login:/app:ro
      - login-data:/data
      - login-shared:/shared
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  client-build:
    logging: *logging
    image: node:24-bookworm-slim
    init: true
    working_dir: /app
    command: ["sh", "/opt/client/build.sh"]
    environment:
      PS_HOST: ${PS_HOST:-ps.localhost}
      CLIENT_FORCE_BUILD: ${CLIENT_FORCE_BUILD:-0}
    volumes:
      - ./client:/app
      - client-node-modules:/app/node_modules
      # config.js e routes.json gerados dos templates (a pasta config/ do fork não é tocada)
      - client-config:/app/config
      # O build lê os dados do nosso servidor (não do repositório da Smogon)
      - ./server:/app/caches/pokemon-showdown
      - server-node-modules:/app/caches/pokemon-showdown/node_modules
      - ./docker/client:/opt/client:ro
    restart: "no"

  server:
    logging: *logging
    <<: *node
    working_dir: /app
    command: ["sh", "/opt/ps/entrypoint.sh"]
    environment:
      PS_HOST: ${PS_HOST:-ps.localhost}
      PS_ADMINS: ${PS_ADMINS:-}
      PS_NO_IP_CHECKS: ${PS_NO_IP_CHECKS:-0}
      LOGIN_KEY_ID: ${LOGIN_KEY_ID:-1}
      LOGIN_PUBLIC_KEY_PATH: /run/login-shared/public.pem
      LOGIN_INTERNAL_TOKEN_PATH: /run/login-shared/internal-token
      LOGIN_INTERNAL_URL: http://login:9000
    volumes:
      - ./server:/app
      - server-node-modules:/app/node_modules
      - ./docker/server/config.js:/opt/ps/config.js:ro
      - ./docker/server/entrypoint.sh:/opt/ps/entrypoint.sh:ro
      # Chave PÚBLICA e token interno, somente leitura (a privada nunca chega aqui)
      - login-shared:/run/login-shared:ro
    depends_on:
      login:
        condition: service_healthy
      # Evita os dois containers escrevendo em server/dist ao mesmo tempo
      client-build:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(8000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  web:
    logging: *logging
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PS_HOST: ${PS_HOST:-ps.localhost}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./client:/srv/client:ro
      - client-config:/srv/client-config:ro
      # Imagens das insígnias (fora do git; ver docs/insignias.md)
      - ./assets/badges:/srv/badges:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      server:
        condition: service_healthy
      login:
        condition: service_healthy

volumes:
  login-data:        # chave privada RSA + banco SQLite de contas
  login-shared:      # chave pública + token interno, compartilhados com o servidor de jogo
  server-node-modules:
  client-node-modules:
  client-config:     # config.js/routes.json do cliente gerados no build
  caddy-data:        # CA local / certificados
  caddy-config:
