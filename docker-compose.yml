# Ambiente do pokemon-showdown-custom.
#
# Serviços:
#   volume-init  ajusta o dono dos volumes para o usuário sem privilégios (roda e termina)
#   login        login server próprio (gera chaves RSA e token interno no 1º start)
#   server-setup prepara o servidor: dependências, build, admins (roda e termina)
#   client-build compila o cliente com os dados do NOSSO servidor (roda e termina)
#   server       servidor de jogo do PS
#   web          Caddy: HTTPS, cliente estático e proxy para login/servidor
#
# Uso: docker compose up -d   →   https://ps.localhost
# Ver docs/ambiente-local.md
#
# Endurecimento (ver docs/revisao-seguranca-lgpd.md, "Containers"): todos os serviços
# rodam com o usuário PS_UID:PS_GID (sem root), sistema de arquivos somente leitura,
# sem capabilities do Linux e sem ganho de privilégios; o código do servidor fica
# somente leitura para o processo que atende os jogadores. Imagens fixadas por digest:
# para atualizar, ver docs/deploy-vps.md, "Atualizar as imagens".

name: pokemon-showdown-custom

x-node-image: &node-image node:24-bookworm-slim@sha256:a5f4366e834695d5f363b920c104953a535d3a9864d1bdf74566a0ebe01daee5

# Logs dos containers com tamanho máximo (LGPD: retenção limitada; os logs podem ter
# nomes de usuário). Até 3 arquivos de 10 MB por serviço.
x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: "3"

x-hardened: &hardened
  user: "${PS_UID:-1000}:${PS_GID:-1000}"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:mode=1777"]

services:
  volume-init:
    logging: *logging
    image: *node-image
    # Único container com root, e só com o necessário para trocar o dono dos arquivos
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    command: ["sh", "/opt/init/volume-init.sh"]
    environment:
      PS_UID: ${PS_UID:-1000}
      PS_GID: ${PS_GID:-1000}
    volumes:
      - ./docker/volume-init.sh:/opt/init/volume-init.sh:ro
      - login-data:/vol/login-data
      - login-shared:/vol/login-shared
      - server-node-modules:/vol/server-node-modules
      - client-node-modules:/vol/client-node-modules
      - client-config:/vol/client-config
      - caddy-data:/vol/caddy-data
      - caddy-config:/vol/caddy-config
      - ${PS_ACCESS_LOG_DIR:-./data/caddy-logs}:/vol/caddy-logs
    restart: "no"

  login:
    logging: *logging
    <<: *hardened
    image: *node-image
    init: true
    restart: unless-stopped
    working_dir: /app
    command: ["node", "src/server.ts"]
    environment:
      PS_HOST: ${PS_HOST:-ps.localhost}
      LOGIN_KEY_ID: ${LOGIN_KEY_ID:-1}
      LOGIN_PRIVATE_KEY_DIR: /data/keys
      LOGIN_DATABASE: /data/login.db
      LOGIN_SHARED_DIR: /shared
      # Nomes de admin só podem ser cadastrados com convite reservado para eles
      PS_ADMINS: ${PS_ADMINS:-}
    volumes:
      - ./login:/app:ro
      - login-data:/data
      - login-shared:/shared
    mem_limit: 256m
    pids_limit: 64
    depends_on:
      volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  server-setup:
    logging: *logging
    <<: *hardened
    image: *node-image
    init: true
    working_dir: /app
    command: ["sh", "/opt/ps/setup.sh"]
    environment:
      HOME: /tmp
      PS_ADMINS: ${PS_ADMINS:-}
    # /deps: package.json derivado (setup.sh); o node_modules dele é o mesmo volume do /app
    tmpfs: ["/tmp:mode=1777", "/deps:mode=1777"]
    volumes:
      - ./server:/app
      - server-node-modules:/app/node_modules
      - server-node-modules:/deps/node_modules
      - ./docker/server:/opt/ps:ro
    depends_on:
      volume-init:
        condition: service_completed_successfully
    restart: "no"

  client-build:
    logging: *logging
    <<: *hardened
    image: *node-image
    init: true
    working_dir: /app
    command: ["sh", "/opt/client/build.sh"]
    environment:
      HOME: /tmp
      PS_HOST: ${PS_HOST:-ps.localhost}
      CLIENT_FORCE_BUILD: ${CLIENT_FORCE_BUILD:-0}
    volumes:
      - ./client:/app
      - client-node-modules:/app/node_modules
      # config.js e routes.json gerados dos templates (a pasta config/ do fork não é tocada)
      - client-config:/app/config
      # O build lê os dados do nosso servidor (não do repositório da Smogon)
      - ./server:/app/caches/pokemon-showdown
      - server-node-modules:/app/caches/pokemon-showdown/node_modules:ro
      - ./docker/client:/opt/client:ro
    depends_on:
      # Dependências do servidor instaladas, e os dois não escrevem em server/dist ao mesmo tempo
      server-setup:
        condition: service_completed_successfully
    restart: "no"

  server:
    logging: *logging
    <<: *hardened
    image: *node-image
    init: true
    restart: unless-stopped
    working_dir: /app
    # O build é feito pelo server-setup; aqui o código é somente leitura
    command: ["node", "pokemon-showdown", "start", "--skip-build"]
    environment:
      PS_HOST: ${PS_HOST:-ps.localhost}
      PS_NO_IP_CHECKS: ${PS_NO_IP_CHECKS:-0}
      LOGIN_KEY_ID: ${LOGIN_KEY_ID:-1}
      LOGIN_PUBLIC_KEY_PATH: /run/login-shared/public.pem
      LOGIN_INTERNAL_TOKEN_PATH: /run/login-shared/internal-token
      LOGIN_INTERNAL_URL: http://login:9000
    volumes:
      # Código, build e dependências somente leitura; o servidor só grava os dados
      - ./server:/app:ro
      - server-node-modules:/app/node_modules:ro
      - ./server/config:/app/config
      - ./server/databases:/app/databases
      - ./server/logs:/app/logs
      - ./docker/server/config.js:/app/config/config.js:ro
      # Chave PÚBLICA e token interno, somente leitura (a privada nunca chega aqui)
      - login-shared:/run/login-shared:ro
    # Inclui os subprocessos do PS (batalhas, validação de times)
    mem_limit: 1536m
    pids_limit: 512
    depends_on:
      login:
        condition: service_healthy
      client-build:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(8000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  web:
    logging: *logging
    <<: *hardened
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    # Única capability: abrir as portas 80 e 443 sem root
    cap_add: [NET_BIND_SERVICE]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PS_HOST: ${PS_HOST:-ps.localhost}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./client:/srv/client:ro
      - client-config:/srv/client-config:ro
      # Imagens das insígnias (fora do git; ver docs/insignias.md)
      - ./assets/badges:/srv/badges:ro
      # Sprites próprios (no git; ex.: o mato alto dos selvagens da Expedição)
      - ./assets/sprites:/srv/our-sprites:ro
      # Log de acesso com IP (14 dias, rotação pelo logrotate da VPS). Em produção,
      # PS_ACCESS_LOG_DIR=/var/log/ps-custom/caddy (ver docs/deploy-vps.md)
      - ${PS_ACCESS_LOG_DIR:-./data/caddy-logs}:/var/log/caddy
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 256m
    pids_limit: 256
    depends_on:
      server:
        condition: service_healthy
      login:
        condition: service_healthy

volumes:
  login-data:        # chave privada RSA + banco SQLite de contas
  login-shared:      # chave pública + token interno, compartilhados com o servidor de jogo
  server-node-modules:
  client-node-modules:
  client-config:     # config.js/routes.json do cliente gerados no build
  caddy-data:        # CA local / certificados
  caddy-config:
